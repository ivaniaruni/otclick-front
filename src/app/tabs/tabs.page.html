<ion-tabs>
  <ion-tab-bar
    slot="bottom"
    *ngIf="usuario"
  >
    <ion-tab-button
      *ngIf="!esTrabajador"
      tab="home"
      href="/tabs/home"
      [attr.aria-label]="'TAB_INICIO' | translate"
    >
      <ion-icon
        name="home-outline"
        aria-hidden="true"
      ></ion-icon>

      <ion-label>
        {{ 'TAB_INICIO' | translate }}
      </ion-label>
    </ion-tab-button>

    <ion-tab-button
      *ngIf="!esTrabajador"
      tab="empresas"
      href="/tabs/empresas"
      [attr.aria-label]="'TAB_EMPRESAS' | translate"
    >
      <ion-icon
        name="storefront-outline"
        aria-hidden="true"
      ></ion-icon>

      <ion-label>
        {{ 'TAB_EMPRESAS' | translate }}
      </ion-label>
    </ion-tab-button>

    <ion-tab-button
      *ngIf="esTrabajador"
      tab="mi-empresa"
      href="/tabs/mi-empresa"
      [attr.aria-label]="
        'TAB_EMPRESA_TRABAJADOR' | translate
      "
    >
      <ion-icon
        name="storefront-outline"
        aria-hidden="true"
      ></ion-icon>

      <ion-label>
        {{ 'TAB_EMPRESA_TRABAJADOR' | translate }}
      </ion-label>
    </ion-tab-button>

    <ion-tab-button
      *ngIf="!esTrabajador"
      tab="citas"
      href="/tabs/citas"
      [attr.aria-label]="'TAB_CITAS' | translate"
    >
      <ion-icon
        name="calendar-outline"
        aria-hidden="true"
      ></ion-icon>

      <ion-label>
        {{ 'TAB_CITAS' | translate }}
      </ion-label>
    </ion-tab-button>

    <ion-tab-button
      *ngIf="esTrabajador"
      tab="agenda-trabajador"
      href="/tabs/agenda-trabajador"
      [attr.aria-label]="'TAB_CITAS' | translate"
    >
      <ion-icon
        name="calendar-outline"
        aria-hidden="true"
      ></ion-icon>

      <ion-label>
        {{ 'TAB_CITAS' | translate }}
      </ion-label>
    </ion-tab-button>

    <ion-tab-button
      tab="mensajes"
      href="/tabs/mensajes"
      [attr.aria-label]="
        pendientes.total() > 0
          ? (
              'TAB_MENSAJES_PENDIENTES'
                | translate: {
                    cantidad: pendientes.total()
                  }
            )
          : ('TAB_MENSAJES' | translate)
      "
    >
      <ion-icon
        name="chatbubbles-outline"
        aria-hidden="true"
      ></ion-icon>

      <ion-label>
        {{ 'TAB_MENSAJES' | translate }}
      </ion-label>

      <ion-badge
        class="unread-badge"
        *ngIf="pendientes.total() > 0"
        aria-hidden="true"
      >
        {{ pendientes.etiqueta() }}
      </ion-badge>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
