<ion-content>
  <main class="auth-shell">
    <section
      class="auth-panel"
      aria-labelledby="login-title"
    >
      <div class="auth-toolbar">
        <app-selector-idioma></app-selector-idioma>
      </div>

      <div class="brand">
        <img
          class="brand-logo"
          src="assets/otclick-logo.jpg"
          alt="OtClick"
          width="128"
          height="128"
        >
      </div>

      <div class="intro">
        <h1 id="login-title">
          {{ 'AUTH.LOGIN_TITULO' | translate }}
        </h1>

        <p>
          {{ 'AUTH.LOGIN_INTRO' | translate }}
        </p>
      </div>

      <form
        #loginForm="ngForm"
        (ngSubmit)="onLogin(loginForm)"
        [attr.aria-busy]="loading"
        novalidate
      >
        <div class="field">
          <ion-input
            name="email"
            [label]="'AUTH.EMAIL' | translate"
            labelPlacement="stacked"
            type="email"
            inputmode="email"
            autocomplete="email"
            autocapitalize="off"
            [spellcheck]="false"
            [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
            [(ngModel)]="email"
            [disabled]="loading"
            required
            email
          ></ion-input>
        </div>

        <div class="field">
          <ion-input
            name="password"
            [label]="'AUTH.PASSWORD' | translate"
            labelPlacement="stacked"
            type="password"
            autocomplete="current-password"
            [placeholder]="
              'AUTH.PASSWORD_PLACEHOLDER' | translate
            "
            [(ngModel)]="password"
            [disabled]="loading"
            required
          ></ion-input>
        </div>

        <ion-text
          *ngIf="error"
          color="danger"
        >
          <p
            class="form-error"
            role="alert"
          >
            {{ error | translate }}
          </p>
        </ion-text>

        <ion-button
          class="submit-button"
          expand="block"
          type="submit"
          [disabled]="loginForm.invalid || loading"
        >
          <ion-spinner
            *ngIf="loading"
            name="crescent"
            aria-hidden="true"
          ></ion-spinner>

          <span>
            {{
              (
                loading
                  ? 'AUTH.LOGIN_CARGANDO'
                  : 'AUTH.LOGIN_BOTON'
              ) | translate
            }}
          </span>
        </ion-button>
      </form>

      <p class="switch-page">
        <span>
          {{ 'AUTH.SIN_CUENTA' | translate }}
        </span>

        <a routerLink="/register">
          {{ 'AUTH.IR_REGISTRO' | translate }}
        </a>
      </p>
    </section>
  </main>
</ion-content>
