<ion-content>
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="login-title">
      <div class="brand">
        <img
          class="brand-logo"
          src="assets/otclick-logo.jpg"
          alt="OtClick"
          width="128"
          height="128"
        >
      </div>

      <div class="intro">
        <h1 id="login-title">Qué bien verte de nuevo.</h1>
        <p>Entra en tu cuenta para gestionar tus citas.</p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="onLogin()">
        <div class="field">
          <ion-input
            name="email"
            label="Correo electrónico"
            labelPlacement="stacked"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="tu@email.com"
            [(ngModel)]="email"
            required
            email
          ></ion-input>
        </div>

        <div class="field">
          <ion-input
            name="password"
            label="Contraseña"
            labelPlacement="stacked"
            type="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            [(ngModel)]="password"
            required
          ></ion-input>
        </div>

        <ion-text *ngIf="error" color="danger">
          <p class="form-error" role="alert">{{ error }}</p>
        </ion-text>

        <ion-button
          class="submit-button"
          expand="block"
          type="submit"
          [disabled]="loginForm.invalid || loading"
        >
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Iniciar sesión</span>
        </ion-button>
      </form>

      <p class="switch-page">
        ¿Aún no tienes cuenta?
        <a routerLink="/register">Crear cuenta</a>
      </p>
    </section>
  </main>
</ion-content>
